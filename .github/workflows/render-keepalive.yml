name: Keep Render API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: render-api-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 90 https://meetplanning-api.onrender.com/health || true)"
            if [ "$status" = "200" ]; then
              echo "API is healthy."
              exit 0
            fi
            echo "Health check returned $status; retry $attempt of 3."
            sleep 45
          done
          exit 1
